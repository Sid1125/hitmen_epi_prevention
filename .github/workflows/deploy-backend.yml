name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'src/forum_app/backend/**'
      - 'discord_bot/**'
      - 'hf_space/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "bot@hitmen.space"
          git config user.name "HITMEN Bot"
          git remote remove hf 2>/dev/null || true
          git remote add hf https://DankSid:$HF_TOKEN@huggingface.co/spaces/DankSid/HITMEN
          git push hf HEAD:main --force
